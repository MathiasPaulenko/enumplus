name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check enumplus/ tests/

      - name: Type check with mypy
        run: mypy --strict enumplus/ tests/

      - name: Run tests
        run: pytest --tb=short

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            RANGE=""
          else
            RANGE="${PREVIOUS_TAG}..HEAD"
          fi

          # Group commits by conventional commit type
          FEATURES=$(git log --pretty=format:"- %s" ${RANGE} --grep="^feat" --grep="^add" --grep="^support" -i | grep -v "release:" || true)
          FIXES=$(git log --pretty=format:"- %s" ${RANGE} --grep="^fix" --grep="^patch" -i || true)
          REFACTOR=$(git log --pretty=format:"- %s" ${RANGE} --grep="^refactor" --grep="^clean" -i || true)
          DOCS=$(git log --pretty=format:"- %s" ${RANGE} --grep="^docs" --grep="^readme" -i || true)
          TESTS=$(git log --pretty=format:"- %s" ${RANGE} --grep="^test" -i || true)
          CHORE=$(git log --pretty=format:"- %s" ${RANGE} --grep="^chore" --grep="^ci" --grep="^build" -i || true)
          RELEASE=$(git log --pretty=format:"- %s" ${RANGE} --grep="^release" -i || true)

          {
            echo "body<<EOF"
            if [ -n "$FEATURES" ]; then
              echo "### Features"
              echo ""
              echo "$FEATURES"
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### Bug Fixes"
              echo ""
              echo "$FIXES"
              echo ""
            fi
            if [ -n "$REFACTOR" ]; then
              echo "### Refactoring"
              echo ""
              echo "$REFACTOR"
              echo ""
            fi
            if [ -n "$DOCS" ]; then
              echo "### Documentation"
              echo ""
              echo "$DOCS"
              echo ""
            fi
            if [ -n "$TESTS" ]; then
              echo "### Tests"
              echo ""
              echo "$TESTS"
              echo ""
            fi
            if [ -n "$CHORE" ]; then
              echo "### Chores"
              echo ""
              echo "$CHORE"
              echo ""
            fi
            echo "---"
            echo ""
            echo "**PyPI**: https://pypi.org/project/enumplus/"
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${{ github.ref_name }}"
            else
              echo "**Commits**: https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: dist/*
          draft: false
          prerelease: false

  publish-pypi:
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
